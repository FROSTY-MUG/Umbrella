services:
  - type: web
    name: umbrella-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: AUTH_ALLOW_DEV_MOCK
        value: "true"
      - key: DATABASE_URL
        value: sqlite:////tmp/umbrella.db
      - key: CORS_ORIGINS
        value: "https://umbrella-os-sigma.vercel.app,http://localhost:3000,*"
      - key: PYTHONPATH
        value: /app
